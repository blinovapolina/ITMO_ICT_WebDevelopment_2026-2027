{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Удаление</title>
    <link rel="stylesheet" href="{% static 'css/owner.css' %}">
</head>

<body>

    <div class="card">
        <h1>Удаление автомобиля</h1>

        <p>Вы уверены, что хотите удалить
            <strong>{{ object.brand }} {{ object.model }} ({{ object.state_number }})</strong>?
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Да, удалить</button>
            <a href="{% url 'car_list' %}">Отмена</a>
        </form>
    </div>

</body>

</html>
