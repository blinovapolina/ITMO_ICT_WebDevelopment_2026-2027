{% extends 'tours/base.html' %}

{% block title %}{% if form.instance.pk %}Редактирование{% else %}Новый тур{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                {% if form.instance.pk %}
                <i class="bi bi-pencil"></i> Редактирование тура
                {% else %}
                <i class="bi bi-plus-circle"></i> Новый тур
                {% endif %}
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check"></i> Сохранить
                    </button>
                    <a href="{% url 'tour_list' %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
