{% extends 'tours/base.html' %}

{% block title %}Удаление тура{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-exclamation-triangle"></i> Удаление тура
            </div>
            <div class="card-body">
                <p>Вы уверены, что хотите удалить тур <strong>{{ object.name }}</strong>?</p>
                <p class="text-muted small">
                    Все резервирования и отзывы к этому туру также будут удалены.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Да, удалить
                    </button>
                    <a href="{% url 'tour_list' %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
