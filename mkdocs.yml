site_name: Веб-программирование. Блинова Полина. Группа К3339
site_description: Лабораторные работы по веб-программированию

theme:
  name: material
  language: ru
  features:
    - navigation.top
    - content.code.copy
  palette:
    primary: indigo
    accent: indigo

nav:
  - Главная: index.md
  - ЛР1. Сокеты: lr1/report.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - attr_list
  - toc:
      permalink: true